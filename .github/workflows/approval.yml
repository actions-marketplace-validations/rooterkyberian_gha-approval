name: gha-approval

on:
  workflow_run:
    workflows: [Copilot, Running Copilot Code Review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Pull request to evaluate
        required: true
        type: string
      dry-run:
        description: Evaluate without submitting an approval
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gha-approval-${{ github.event.workflow_run.pull_requests[0].number || inputs.pull-request-number }}
  cancel-in-progress: false

jobs:
  approve:
    # Run from the default branch after Copilot completes. Review webhooks are
    # gated by GitHub; the action still verifies the reviewer and current SHA.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0].number != null)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Pin to reviewed action code; this privileged job never executes PR code.
      - name: Apply approval policy
        uses: rooterkyberian/gha-approval@9ac997db10ef829f40d6ed305646d425d9579941
        with:
          pull-request-number: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pull-request-number }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
          max-changed-lines: '1000'
          line-count-exclude: |
            **/*.lock
            **/package-lock.json
          review-author: copilot-pull-request-reviewer[bot]
          post-comment: 'true'
          allowlist: |
            src/**
            test/**
            docs/**
            README.md
            LICENSE
            action.yml
            package.json
            package-lock.json
            uv.lock
            .gitignore
          denylist: |
            .github/**
