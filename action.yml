name: gha-approval
description: Approve PRs only after an explicit Copilot recommendation and configurable policy checks.
author: rooterkyberian
branding:
  icon: check-circle
  color: green
inputs:
  github-token:
    description: Token with pull-requests write permission.
    default: ${{ github.token }}
  pull-request-number:
    description: PR number; defaults to the event pull request.
  max-changed-lines:
    description: Exclusive upper limit for additions plus deletions; 0 disables the limit.
    default: '1000'
  line-count-exclude:
    description: Newline-separated file globs excluded from the line count. Other path rules still apply; both paths of a rename must match to exclude it.
  allowlist:
    description: Newline-separated allowed file globs; empty allows all otherwise permitted paths.
  denylist:
    description: Newline-separated blocked file globs, in addition to mandatory instruction protections.
  dry-run:
    description: Evaluate all rules without submitting an approval or decision comment.
    default: 'false'
  post-comment:
    description: Post a PR comment explaining each completed approval decision; ignored during dry runs.
    default: 'true'
  review-author:
    description: Exact GitHub username whose latest review can authorize approval.
    default: copilot-pull-request-reviewer[bot]
  first-review-only:
    description: Only allow approval when the configured reviewer has exactly one submitted review across the entire PR, including dismissed reviews and earlier commits.
    default: 'false'
  approval-regexp:
    description: JavaScript regular expression source tested against the trimmed review body, with the Unicode flag. Empty uses the strict Copilot heading detector.
outputs:
  eligible:
    description: Whether every approval requirement passed.
  approved:
    description: Whether this run submitted an approving review.
  head-sha:
    description: Evaluated PR head commit.
  reviewer-review-id:
    description: Latest configured reviewer review ID for the evaluated commit.
  decision-comment-id:
    description: Posted decision comment ID; empty when comments are disabled or in dry runs.
  reasons:
    description: JSON array explaining blocked or skipped approval.
runs:
  using: node24
  main: src/main.js
